[package]
name = "kaspaveil-wire"
version = "0.1.0"
edition = "2021"
description = "Third independent implementation of the Kaspaveil v1 wire format (from WIRE_FORMAT.md alone)"
publish = false
license = "AGPL-3.0-only"

[dependencies]
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
ml-kem = { version = "=0.2.1", features = ["deterministic"] }
kem = "=0.3.0-pre.0"
chacha20poly1305 = "=0.10.1"
hkdf = "=0.12.4"
hmac = "=0.12.1"
sha2 = "0.10"
blake2 = "=0.10.6"
blake3 = "1.8"
k256 = { version = "=0.13.4", features = ["schnorr"] }
bip39 = { version = "=2.1.0", features = ["std"] }
hex = "0.4"
serde_json = "1"

[profile.test]
opt-level = 2
