[package]
name = "kaspaveil-ceremony"
description = "Kaspaveil root-key ceremony: 2-of-3 FROST (BIP-340) key generation and relay-certificate signing"
version = "0.1.0"
edition = "2021"
publish = false
license = "LicenseRef-Proprietary"

[dependencies]
frost-secp256k1-tr = { version = "=3.0.0", features = ["serde"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
blake2b_simd = "1"
secp256k1 = { version = "0.29", features = ["global-context"] }
